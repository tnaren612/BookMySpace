spring:
  application:
    name: platform-api
  profiles:
    default: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bookmyspace}
    username: ${DATABASE_USER:bookmyspace}
    password: ${DATABASE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  autoconfigure:
    exclude:
      # Phase 1: do not require live Postgres/Redis to boot the shell.
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

bookmyspace:
  app-name: BookMySpace Platform API
  environment: ${APP_ENV:local}

logging:
  level:
    root: INFO
    com.bookmyspace: ${LOG_LEVEL:DEBUG}

---
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    com.bookmyspace: DEBUG

---
spring:
  config:
    activate:
      on-profile: test

bookmyspace:
  environment: test

logging:
  level:
    root: WARN
    com.bookmyspace: INFO
