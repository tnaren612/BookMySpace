name: CI Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "packages/api_contracts/**"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "packages/api_contracts/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  platform-api:
    name: platform-api build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/platform-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Test
        run: ./gradlew test --no-daemon
